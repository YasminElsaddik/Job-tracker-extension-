<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px;
      padding: 20px;
      background: #ffffff;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }
    #status {
      font-size: 13px;
      color: #555;
      margin-bottom: 14px;
      min-height: 18px;
      line-height: 1.5;
    }
    #status.success { color: #1D9E75; }
    #status.error { color: #E24B4A; }
    #status.loading { color: #888; }
    button {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #333; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .site-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #f0f0f0;
      color: #555;
      margin-bottom: 14px;
    }
    .unsupported {
      font-size: 13px;
      color: #E24B4A;
      text-align: center;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <h1>Job Tracker</h1>
  <p class="subtitle">Save this job to Notion</p>
  <div id="site-info"></div>
  <div id="status"></div>
  <div id="action-area"></div>

  <script src="popup.js"></script>
</body>
</html>
